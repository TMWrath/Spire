appId: com.tmwrath.spire
productName: Spire
asar: true
npmRebuild: false
directories:
  output: release-desktop
files:
  - desktop-dist/**
  - dist/**
  - package.json
  - '!node_modules/**'
win:
  target:
    - target: zip
      arch: [x64]
  signAndEditExecutable: false
artifactName: Spire-${version}-windows-${arch}.${ext}
